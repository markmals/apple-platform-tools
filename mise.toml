experimental_monorepo_root = true

[settings]
experimental = true

[tools]
# Swift + swift-format come from the active Xcode / command-line-tools toolchain.
# `brew install swift-format` if `swift format` isn't on your toolchain.

[tasks.fmt]
description = "Format Swift sources; pass file paths, or omit to format Sources and Tests"
run = "swift format --in-place --recursive ${@:-Sources Tests}"

[tasks.lint]
description = "Lint Swift sources (swift-format, strict)"
run = "swift format lint --strict --recursive Sources Tests"

[tasks.build]
description = "Build all tools and libraries (debug)"
run = "swift build"

[tasks.test]
description = "Run the Swift Testing suite"
run = "swift test"

[tasks.install]
description = "Build, ad-hoc sign, and install the distributable CLIs to ~/.local/bin"
run = "scripts/install-tools.sh"
