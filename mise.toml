experimental_monorepo_root = true

[settings]
experimental = true

[tools]
# Swift + swift-format come from the active Xcode / command-line-tools toolchain.
# `brew install swift-format` if `swift format` isn't on your toolchain.

[tasks.fmt]
description = "Format Swift sources; pass file paths, or omit to format Sources and Tests"
run = "swift format --in-place --recursive ${@:-Sources Tests}"

[tasks.lint]
description = "Lint Swift sources (swift-format, strict)"
run = "swift format lint --strict --recursive Sources Tests"

[tasks.build]
description = "Build all tools and libraries (debug)"
run = "swift build"

[tasks.test]
description = "Run the Swift Testing suite"
run = "swift test"

[tasks."mac-dev-skills-contracts:generate"]
description = "Regenerate downstream CLI contract exports for mac-dev-skills"
run = "scripts/generate-mac-dev-skills-contracts.sh"

[tasks."mac-dev-skills-contracts:check"]
description = "Fail if downstream CLI contract exports drift from Specs/Features"
run = "scripts/generate-mac-dev-skills-contracts.sh --check"

[tasks.install]
description = "Build, ad-hoc sign, and install the distributable CLIs to ~/.local/bin"
run = "scripts/install-tools.sh"

[tasks.uitool-sign]
description = "Build, then sign uitool with the debugger entitlement (required for `uitool attach`)"
run = """
swift build
bin="$(swift build --show-bin-path)"
codesign -s - --force --entitlements scripts/uitool-debugger.entitlements "$bin/uitool"
echo "signed $bin/uitool for attach-to-running (com.apple.security.cs.debugger)"
"""
